name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/ipa-*', 'codex/fadedai-village-integration']

permissions:
  contents: read
  actions: read

jobs:
  test:
    if: ${{ github.ref_name != 'codex/ipa-launch-repair-a78156f' && github.ref_name != 'codex/ipa-bus-package-65e772a' }}
    # Separate runners prevent Release XCTest from consuming the device build's budget.
    runs-on: macos-26-intel
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify project wiring before compiling
        run: python3 verify_project.py
      - name: Run Release XCTest on an iPhone simulator
        run: |
          set -o pipefail
          xcodebuild -version
          simulator_arch="$(uname -m)"
          case "$simulator_arch" in
            arm64|x86_64) ;;
            *) echo "Unsupported simulator host architecture: $simulator_arch"; exit 1 ;;
          esac
          simulator="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"].get("com.apple.CoreSimulator.SimRuntime.iOS-26-2", [])
          for device in devices:
              if device["name"] == "iPhone 17 Pro Max" and device.get("isAvailable", False):
                  print(device["udid"])
                  break
          else:
              sys.exit("iPhone 17 Pro Max with iOS 26.2 is missing from the runner.")
          ')"
          xcodebuild -project SweatCaster.xcodeproj -scheme SweatCaster \
            -configuration Release ENABLE_TESTABILITY=YES \
            -destination "platform=iOS Simulator,id=$simulator" \
            -parallel-testing-enabled NO ARCHS="$simulator_arch" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee "$RUNNER_TEMP/FadedAI-XCTest.log"
      - name: Show actionable Xcode errors
        if: ${{ failure() }}
        run: python3 tools/report_xcode_errors.py --workspace "$GITHUB_WORKSPACE" "$RUNNER_TEMP/FadedAI-XCTest.log" "$RUNNER_TEMP/FadedAI-Device.log"

  build:
    if: ${{ github.ref_name != 'codex/ipa-launch-repair-a78156f' && github.ref_name != 'codex/fadedai-village-integration' }}
    # ARM hosts twice failed before acquiring a runner. Keep Xcode 26.3 on the Intel pool.
    runs-on: macos-26-intel
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify project wiring before compiling
        run: python3 verify_project.py
      - name: Verify unchanged source for the packaging-only retry
        if: ${{ github.ref_name == 'codex/ipa-bus-package-65e772a' }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 65e772a0c609c1e55b83f368a718ffe0a1e09989
          git diff --exit-code FETCH_HEAD HEAD -- . ':(exclude).github/workflows/build.yml'
      - name: Build for iPhone without signing
        run: |
          set -o pipefail
          xcodebuild -project SweatCaster.xcodeproj -scheme SweatCaster \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SweatCasterBuild" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            2>&1 | tee "$RUNNER_TEMP/FadedAI-Device.log"
      - name: Show actionable Xcode errors
        if: ${{ failure() }}
        run: python3 tools/report_xcode_errors.py --workspace "$GITHUB_WORKSPACE" "$RUNNER_TEMP/FadedAI-XCTest.log" "$RUNNER_TEMP/FadedAI-Device.log"
      - name: Package IPA
        run: |
          set -euxo pipefail
          app="$RUNNER_TEMP/SweatCasterBuild/Build/Products/Release-iphoneos/FadedAI.app"
          test -x "$app/FadedAI"
          xcrun lipo "$app/FadedAI" -verify_arch arm64
          test ! -e "$app/_CodeSignature"
          for bundle in "$app" "$app"/PlugIns/*.appex; do
            test -d "$bundle" || continue
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$bundle/Info.plist"
          done
          staging="$(mktemp -d)"
          mkdir "$staging/Payload"
          ditto "$app" "$staging/Payload/FadedAI.app"
          cd "$staging"
          zip -qr "$RUNNER_TEMP/FadedAI-unsigned.ipa" Payload
          unzip -tq "$RUNNER_TEMP/FadedAI-unsigned.ipa"
          python3 "$GITHUB_WORKSPACE/verify_ipa.py" "$RUNNER_TEMP/FadedAI-unsigned.ipa"
      - name: Prepare separate AltStore IPA with memory request
        run: |
          set -euo pipefail
          python3 tools/package_memory_request.py "$RUNNER_TEMP/FadedAI-unsigned.ipa" \
            "$RUNNER_TEMP/FadedAI-AltStore-memory-request.ipa" --entitlements App/FadedAI.entitlements
          python3 verify_ipa.py "$RUNNER_TEMP/FadedAI-AltStore-memory-request.ipa"
          python3 tools/inspect_ipa_memory.py "$RUNNER_TEMP/FadedAI-AltStore-memory-request.ipa" --require-memory-request
      - uses: actions/upload-artifact@v4
        with:
          name: FadedAI-device-candidate
          compression-level: 0
          path: |
            ${{ runner.temp }}/FadedAI-unsigned.ipa
            ${{ runner.temp }}/FadedAI-AltStore-memory-request.ipa
          if-no-files-found: error
          retention-days: 1
      - name: Preserve packaging inputs if validation fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: FadedAI-packaging-diagnostics
          compression-level: 0
          path: |
            ${{ runner.temp }}/FadedAI-unsigned.ipa
            ${{ runner.temp }}/SweatCasterBuild/Build/Products/Release-iphoneos/PackageFrameworks
            ${{ runner.temp }}/FadedAI-Device.log
          if-no-files-found: ignore
          retention-days: 1

  publish:
    # Never publish an installable release when either compile or tests failed.
    needs: [test, build]
    if: ${{ always() && needs.build.result == 'success' && (needs.test.result == 'success' || (needs.test.result == 'skipped' && github.ref_name == 'codex/ipa-bus-package-65e772a')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FadedAI-device-candidate
          path: ready
      - uses: actions/upload-artifact@v4
        with:
          name: FadedAI-unsigned
          path: ready/FadedAI-unsigned.ipa
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: FadedAI-AltStore-memory-request
          path: ready/FadedAI-AltStore-memory-request.ipa
          compression-level: 0
          if-no-files-found: error

  repair-package:
    if: ${{ github.ref_name == 'codex/ipa-launch-repair-a78156f' }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify app sources match the tested build 65
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin a78156ff316bc4afba1c44119dbd70ddca2eca1c
          git diff --exit-code FETCH_HEAD HEAD -- App Dependencies Shared Widgets Tests
      - uses: actions/download-artifact@v4
        with:
          name: FadedAI-unsigned
          path: previous-build
          run-id: 43813191330
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair framework lookup and verify the final IPA
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          unzip -q previous-build/FadedAI-unsigned.ipa -d "$staging"
          app="$staging/Payload/FadedAI.app"
          test -x "$app/FadedAI"
          test ! -e "$app/_CodeSignature"
          xcrun install_name_tool -add_rpath '@executable_path/Frameworks' "$app/FadedAI"
          for bundle in "$app" "$app"/PlugIns/*.appex; do
            test -d "$bundle" || continue
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$bundle/Info.plist"
          done
          cd "$staging"
          zip -qr "$RUNNER_TEMP/FadedAI-unsigned.ipa" Payload
          unzip -tq "$RUNNER_TEMP/FadedAI-unsigned.ipa"
          python3 "$GITHUB_WORKSPACE/verify_ipa.py" "$RUNNER_TEMP/FadedAI-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: FadedAI-unsigned
          path: ${{ runner.temp }}/FadedAI-unsigned.ipa
          if-no-files-found: error
