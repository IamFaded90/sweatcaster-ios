name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run XCTest on an iPhone simulator
        run: |
          simulator="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; runtimes=json.load(sys.stdin)["devices"]; print(next(d["udid"] for devices in runtimes.values() for d in devices if d["name"].startswith("iPhone")))')"
          xcodebuild -project SweatCaster.xcodeproj -scheme SweatCaster \
            -destination "platform=iOS Simulator,id=$simulator" \
            -parallel-testing-enabled NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO test
      - name: Build for iPhone without signing
        run: |
          xcodebuild -version
          xcodebuild -project SweatCaster.xcodeproj -scheme SweatCaster \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SweatCasterBuild" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        run: |
          app="$RUNNER_TEMP/SweatCasterBuild/Build/Products/Release-iphoneos/SweatCaster.app"
          test -x "$app/SweatCaster"
          test ! -e "$app/_CodeSignature"
          staging="$(mktemp -d)"
          mkdir "$staging/Payload"
          ditto "$app" "$staging/Payload/SweatCaster.app"
          cd "$staging"
          zip -qr "$RUNNER_TEMP/FadedAI-unsigned.ipa" Payload
          unzip -tq "$RUNNER_TEMP/FadedAI-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: FadedAI-unsigned
          path: ${{ runner.temp }}/FadedAI-unsigned.ipa
          if-no-files-found: error
